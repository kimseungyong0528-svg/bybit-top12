<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">


<meta charset="UTF-8">
<title>Binance 선물 실시간 TOP12</title>
<style>
  :root { --bg:#0b0e11; --card:#161a1e; --line:#2b3139; --txt:#eaecef; --sub:#848e9c; --up:#20b26c; --dn:#ef454a; --acc:#f7a600; --fav:#f0b90b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif; font-size:13px; overflow:hidden; user-select:none; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--bg); }
  .grp { display:flex; gap:4px; align-items:center; }
  .grp span.lbl { color:var(--sub); margin-right:4px; }
  .sep { width:1px; height:24px; background:var(--line); }
  button { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:13px; }
  button.on { background:var(--acc); color:#000; border-color:var(--acc); font-weight:700; }
  button[data-mode="gain"].on { background:var(--up); border-color:var(--up); color:#fff; }
  button[data-mode="lose"].on { background:var(--dn); border-color:var(--dn); color:#fff; }
  button.tool { padding:3px 6px; color:#b7bdc6; display:inline-flex; align-items:center; }
  button.tool svg { width:22px; height:22px; display:block; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; }
  button.tool:hover { color:#fff; }
  button.tool.on { background:#2962ff; border-color:#2962ff; color:#fff; }
  button.danger { color:#ef454a; }
  select { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:5px 6px; font-size:13px; }
  #status { margin-left:auto; color:var(--sub); }
  #grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:repeat(4,minmax(0,1fr)) 104px; gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); height:calc(100vh - var(--hh, 52px)); height:calc(100dvh - var(--hh, 52px)); }
  #empty { grid-column:1 / -1; grid-row:1 / -1; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:15px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px 6px; position:relative; display:flex; flex-direction:column; min-height:0; min-width:0; }
  .card.fav { border-color:var(--fav); }
  .btcwrap { display:grid; grid-template-rows:repeat(2,minmax(0,1fr)); gap:6px; min-height:0; min-width:0; }
  .tf { color:#000; background:#eaecef; border-radius:4px; padding:0 6px; font-size:12px; font-weight:700; }
  .chart { flex:1; position:relative; min-height:0; }
  .top { display:flex; align-items:baseline; gap:6px; }
  .star svg { width:12px; height:12px; display:block; }
  .star { cursor:pointer; color:#5e6673; font-size:0; line-height:0; padding:0; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border:1px solid #474d57; border-radius:4px; align-self:center; }
  .star:hover { color:#c9a227; border-color:#c9a227; }
  .star.on { color:var(--fav); border-color:var(--fav); }
  .rank { color:var(--acc); font-weight:700; min-width:18px; }
  .sym { font-weight:700; font-size:17px; cursor:pointer; }
  .sym:hover { color:var(--acc); text-decoration:underline; }
  .chg { margin-left:auto; font-weight:700; font-size:17px; }
  .meta { color:var(--sub); display:flex; gap:10px; margin:2px 0 4px 44px; font-size:12px; }
  .new { color:#000; background:var(--acc); border-radius:4px; padding:0 5px; font-size:11px; font-weight:700; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='19' height='19'><path d='M9.5 1v17M1 9.5h17' stroke='%239aa0a6' stroke-width='1.4'/></svg>") 9 9, crosshair; }
  .del { position:absolute; left:2px; bottom:2px; display:none; z-index:3; width:24px; height:24px; padding:3px; background:#1e2329; border:1px solid #474d57; border-radius:5px; color:#eaecef; cursor:pointer; }
  .del:hover { color:#ff8fa3; border-color:#ff8fa3; }
  .del svg { width:16px; height:16px; display:block; }
  .up { color:var(--up); } .dn { color:var(--dn); }
  .calc { padding:0; container-type:size; grid-column:1 / -1; }
  .c1 { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:10px 14px; align-items:center; height:100%; }
  .c1 .ins { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .c1 label { font-size:11px; color:#848e9c; display:flex; flex-direction:column; gap:3px; min-width:0; }
  .c1 label .ls { display:none; }
  .c1 input { width:100%; min-width:0; background:#0b0e11; border:1px solid #3a404a; border-radius:6px; padding:5px 8px; font-size:15px; font-weight:700; color:#fff; text-align:right; font-family:inherit; }
  .c1 input:focus { outline:none; border-color:#f0b90b; }
  .c1 .res { background:#f0b90b; color:#000; border-radius:10px; padding:8px 16px; text-align:right; min-width:190px; }
  .c1 .res .l { font-size:11px; font-weight:700; opacity:.75; text-align:left; white-space:nowrap; }
  .c1 .res .v { font-size:30px; font-weight:900; letter-spacing:-.02em; white-space:nowrap; }
  /* narrow cells (tablet portrait etc.): 2x2 inputs with the label beside the box, result bar below */
  @container (max-width: 560px) {
    .c1 { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; gap:6px; padding:8px 10px; align-content:stretch; }
    .c1 .ins { grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 8px; align-content:center; }
    .c1 label { flex-direction:row; align-items:center; gap:6px; white-space:nowrap; }
    .c1 label .lf { display:none; } .c1 label .ls { display:inline; flex:none; }
    .c1 input { padding:3px 6px; font-size:14px; }
    .c1 .res { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 10px; min-width:0; border-radius:8px; }
    .c1 .res .v { font-size:clamp(17px, 15cqh, 22px); }
  }
  @container (max-width: 300px) {
    .c1 { padding:6px 7px; } .c1 .ins { gap:5px 6px; } .c1 label { font-size:10px; gap:4px; } .c1 input { font-size:12.5px; padding:2px 4px; } .c1 .res { padding:3px 8px; } .c1 .res .l { font-size:10px; }
  }
  @container (max-width: 560px) and (max-height: 120px) {
    .c1 { padding:5px 8px; gap:4px; } .c1 .ins { gap:4px 8px; } .c1 input { padding:1px 6px; font-size:13px; } .c1 .res { padding:2px 10px; } .c1 .res .l { font-size:10px; }
  }
</style>
</head>
<body>
<header>
  <div class="grp"><span class="lbl">순위</span>
    <button data-mode="gain" class="on">24h 상승 TOP</button>
    <button data-mode="lose">24h 하락 TOP</button>
  </div>
  <div class="grp"><span class="lbl">차트</span>
    <select id="itv">
      <option value="5">5분</option><option value="15" selected>15분</option><option value="60">1시간</option><option value="240">4시간</option><option value="D">일봉</option>
    </select>
  </div>
  <div class="grp"><label><input type="checkbox" id="exMajor"> BTC·ETH 제외</label></div>
  <div class="sep"></div>
  <div class="grp"><span class="lbl">그리기</span>
    <button class="tool on" data-tool="cursor" title="커서 (그림 클릭: 선택, 드래그: 이동, 흰 점 드래그: 조절)"><svg viewBox="0 0 24 24"><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg></button>
    <button class="tool" data-tool="rect" title="박스 (한 꼭짓점 클릭, 반대 꼭짓점 클릭)"><svg viewBox="0 0 24 24"><path d="M7.2 5h9.6M7.2 19h9.6M5 7.2v9.6M19 7.2v9.6"/><circle cx="5" cy="5" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/></svg></button>
    <button class="tool" data-tool="hline" title="수평선 (한 번 클릭)"><svg viewBox="0 0 24 24"><path d="M3 12h6.8M14.2 12H21"/><circle cx="12" cy="12" r="2.2"/></svg></button>
    <button class="tool" data-tool="trend" title="추세선 (시작점 클릭, 끝점 클릭)"><svg viewBox="0 0 24 24"><path d="M6.6 17.4L17.4 6.6"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="5" r="2.2"/></svg></button>
    <button id="clearAll" class="danger" title="모든 코인의 그림 삭제">전체삭제</button>
  </div>
  <span id="status">불러오는 중...</span>
</header>
<div id="grid"></div>

<script>
const API = 'https://api.bybit.com/v5/market';
const COUNT = 8, SHOW = 50, MIN_TURNOVER = 0, REFRESH_MS = 60000;
const STABLE = /^(USDC|USD1|USDE|FDUSD|TUSD|DAI|PYUSD|RLUSD|USDD|USDT|EURC|EUR)USDT$/;
const FIB_LV = [-3, -2, -1, 0, 1, 2, 3];
const COL = { line: '#ffb3c7', fib: '#9aa0a6', box: '#a855f7', boxFill: 'rgba(168,85,247,0.16)', last: '#6b7280' };
const ERASER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8.5L3.6 15.1a2 2 0 0 1 0-2.8L13.3 2.6a2 2 0 0 1 2.8 0l5.3 5.3a2 2 0 0 1 0 2.8L11 21"/><path d="M8 9l7 7"/></svg>';

const $ = id => document.getElementById(id);
const S = JSON.parse(localStorage.getItem('bbTop12v4') || '{}');
let mode = (S.mode === 'gain' || S.mode === 'lose') ? S.mode : 'gain', ex = 'binance';
let byInfo = null, byInfoAt = 0;
const BN = 'https://fapi.binance.com/fapi/v1', BN_ITV = { '5': '5m', '15': '15m', '60': '1h', '240': '4h', 'D': '1d' };
let bnInfo = null, bnInfoAt = 0;
if (S.itv) $('itv').value = S.itv;
if (S.exMajor) $('exMajor').checked = true;
let favs = JSON.parse(localStorage.getItem('bbFav') || '[]');
let drawings = JSON.parse(localStorage.getItem('bbDraw') || '{}');   // { SYMBOL: [ {type, p1:{t,p}, p2:{t,p}, p3?} ] }
for (const k in drawings) { drawings[k] = drawings[k].filter(d => d.type !== 'fibF'); if (!drawings[k].length) delete drawings[k]; }
let tool = 'cursor', pending = null, selected = null, drag = null;
let cards = [], prevSyms = new Set(), reqId = 0;
let undoStack = [], redoStack = [], clip = null, hoverSym = null;
const snap = () => JSON.stringify(drawings);
function pushUndo(before) { undoStack.push(before ?? snap()); if (undoStack.length > 100) undoStack.shift(); redoStack = []; }
function restoreDraw(s) { drawings = JSON.parse(s); selected = null; pending = null; saveDraw(); redrawAll(); }
function undo() { if (!undoStack.length) return; redoStack.push(snap()); restoreDraw(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(snap()); restoreDraw(redoStack.pop()); }
function copySelected() {
  if (!selected || !drawings[selected.sym] || !drawings[selected.sym][selected.i]) return false;
  clip = { sym: selected.sym, d: JSON.parse(JSON.stringify(drawings[selected.sym][selected.i])) };
  return true;
}
function paste() {
  if (!clip) return;
  const card = cardOf(hoverSym) || cardOf(clip.sym);
  if (!card || !card.G) return;
  const d = JSON.parse(JSON.stringify(clip.d));
  if (card.sym !== clip.sym && card.hover) {   // other coin: move the copy to the mouse position
    const t = card.G.t(card.hover.x), p = card.G.p(card.hover.y), dt = t - d.p1.t, dp = p - d.p1.p;
    ['p1', 'p2', 'p3'].forEach(k => { if (d[k]) d[k] = { t: d[k].t + dt, p: d[k].p + dp }; });
  }
  pushUndo();
  const arr = (drawings[card.sym] = drawings[card.sym] || []);
  arr.push(d); selected = { sym: card.sym, i: arr.length - 1 };
  saveDraw(); redrawAll();
}

function save() { localStorage.setItem('bbTop12v4', JSON.stringify({ mode, ex, itv:$('itv').value, exMajor:$('exMajor').checked })); }
function saveDraw() { localStorage.setItem('bbDraw', JSON.stringify(drawings)); }
function saveFav() { localStorage.setItem('bbFav', JSON.stringify(favs)); }
function fitGrid() {
  document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px');
  // tablets/phones: size the grid to the area actually visible (above the browser bar and the system buttons)
  const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  $('grid').style.height = (vh - document.querySelector('header').offsetHeight) + 'px';
}
const cardOf = sym => cards.find(c => c.sym === sym);
const redrawAll = () => cards.forEach(drawCard);

document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  mode = b.dataset.mode; prevSyms = new Set(); selected = null;
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b));
  save(); load();
});
['itv','exMajor'].forEach(id => $(id).onchange = () => { save(); load(); });
document.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => {
  if (ex === b.dataset.ex) return;
  ex = b.dataset.ex; prevSyms = new Set(); selected = null;
  document.querySelectorAll('[data-ex]').forEach(x => x.classList.toggle('on', x === b));
  save(); load();
});

function setTool(t) {
  tool = t; pending = null;
  if (t !== 'cursor') selected = null;
  document.querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('on', x.dataset.tool === t));
  document.body.classList.toggle('drawing', t !== 'cursor');
  redrawAll();
}
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$('clearAll').onclick = () => {
  if (!confirm('모든 코인에 그린 그림을 전부 지울까요? (Ctrl+Z로 되돌릴 수 있어요)')) return;
  pushUndo(); drawings = {}; selected = null; saveDraw(); redrawAll();
};
function deleteSelected() {
  if (!selected || !drawings[selected.sym] || !drawings[selected.sym][selected.i]) return;
  pushUndo();
  const arr = drawings[selected.sym];
  arr.splice(selected.i, 1);
  if (!arr.length) delete drawings[selected.sym];
  const c = cardOf(selected.sym); selected = null; saveDraw(); if (c) drawCard(c);
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { selected = null; setTool('cursor'); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected) { e.preventDefault(); deleteSelected(); return; }
  if (!(e.ctrlKey || e.metaKey)) return;
  // e.code works even when the Korean IME is on
  if (e.code === 'KeyZ' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (e.code === 'KeyY' || (e.code === 'KeyZ' && e.shiftKey)) { e.preventDefault(); redo(); }
  else if (e.code === 'KeyX') { e.preventDefault(); if (copySelected()) deleteSelected(); }
  else if (e.code === 'KeyC') { if (copySelected()) e.preventDefault(); }
  else if (e.code === 'KeyV') { if (clip) { e.preventDefault(); paste(); } }
});
function toggleFav(sym, el) {
  const i = favs.indexOf(sym);
  if (i >= 0) favs.splice(i, 1); else favs.push(sym);
  saveFav();
  const on = favs.includes(sym);
  document.querySelectorAll('.card[data-coin="' + sym + '"]').forEach(c => {
    c.classList.toggle('fav', on);
    const s = c.querySelector('.star'); s.classList.toggle('on', on); s.innerHTML = starSvg(on);
  });
}

function starSvg(on) {
  return `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
// Coin name click.
// With the '대시보드 → 바이비트 연결' extension installed: go to the already-open Bybit tab, switch coin + timeframe
// (new window only if Bybit is not open). Without it: reuse the tab this dashboard opened before.
function openBybit(sym) {
  const w = window.open('https://www.binance.com/ko/futures/' + sym, 'binanceFromDashboard');
  if (w) { try { w.focus(); } catch (e) {} }
}
function fmtUsd(v) { if (v >= 1e9) return '$' + (v/1e9).toFixed(2) + 'B'; if (v >= 1e6) return '$' + (v/1e6).toFixed(1) + 'M'; return '$' + (v/1e3).toFixed(0) + 'K'; }
function fmtPx(p) { p = +p; const a = Math.abs(p); if (a >= 100) return p.toFixed(2); if (a >= 1) return p.toFixed(4); return p.toPrecision(4); }

// common ticker shape: { symbol, pct (fraction), turnover (USDT), last }
async function getTickers() {
  if (ex === 'binance') {
    if (!bnInfo || Date.now() - bnInfoAt > 30 * 60 * 1000) {   // tradable USDT perpetuals, refreshed every 30 min
      const ei = await (await fetch(`${BN}/exchangeInfo`)).json();
      bnInfo = new Set(ei.symbols.filter(s => s.status === 'TRADING' && s.contractType === 'PERPETUAL' && s.quoteAsset === 'USDT' && s.underlyingType === 'COIN').map(s => s.symbol));
      bnInfoAt = Date.now();
    }
    const t = await (await fetch(`${BN}/ticker/24hr`)).json();
    return t.filter(x => bnInfo.has(x.symbol)).map(x => ({ symbol: x.symbol, pct: x.priceChangePercent / 100, turnover: +x.quoteVolume, last: +x.lastPrice }));
  }
  if (!byInfo || Date.now() - byInfoAt > 30 * 60 * 1000) {
    // Bybit 'Crypto > Perpetual > USDT' list only: drop TradFi (stock, ETF, commodity, forex) contracts
    const all = []; let cursor = '';
    do {
      const r = await (await fetch(`${API}/instruments-info?category=linear&limit=1000${cursor ? '&cursor=' + encodeURIComponent(cursor) : ''}`)).json();
      all.push(...r.result.list); cursor = r.result.nextPageCursor;
    } while (cursor);
    byInfo = new Set(all.filter(s => s.contractType === 'LinearPerpetual' && s.status === 'Trading' && s.quoteCoin === 'USDT' && (!s.symbolType || s.symbolType === 'innovation')).map(s => s.symbol));
    byInfoAt = Date.now();
  }
  const j = await (await fetch(`${API}/tickers?category=linear`)).json();
  return j.result.list.filter(x => byInfo.has(x.symbol) && (!x.curPreListingPhase || x.curPreListingPhase === 'Finished'))
    .map(x => ({ symbol: x.symbol, pct: +x.price24hPcnt, turnover: +x.turnover24h, last: +x.lastPrice }));
}
async function getTop() {
  const all = await getTickers();
  let list = all.filter(t => !STABLE.test(t.symbol) && t.turnover >= MIN_TURNOVER && t.last > 0);
  if ($('exMajor').checked) list = list.filter(t => !/^(BTC|ETH)USDT$/.test(t.symbol));
  const key = mode === 'gain' ? (t => -t.pct) : (t => t.pct);
  list.sort((a, b) => key(a) - key(b));
  return list.slice(0, COUNT).map(t => ({ ...t, itv: $('itv').value, key: t.symbol, plain: true, lim: SHOW + 30 }));
}
async function getKline(sym, itv, lim) {
  if (ex === 'binance') {
    const k = await (await fetch(`${BN}/klines?symbol=${sym}&interval=${BN_ITV[itv]}&limit=${lim}`)).json();
    return (Array.isArray(k) ? k : []).map(r => ({ t:+r[0], o:+r[1], h:+r[2], l:+r[3], c:+r[4], v:+r[5] }));
  }
  const j = await (await fetch(`${API}/kline?category=linear&symbol=${sym}&interval=${itv}&limit=${lim}`)).json();
  if (j.retCode !== 0) throw new Error(j.retMsg || 'kline error');   // e.g. 10006 rate limit
  return (j.result?.list || []).map(k => ({ t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5] })).reverse();
}

// Candle cache: full candles are re-downloaded only when a coin is new, every 60 s, or when a new candle starts.
// In between, the last candle is updated from the ticker price. This keeps requests far below Bybit's rate limit.
const klineCache = {};
const wait = ms => new Promise(r => setTimeout(r, ms));
async function getKlineRetry(sym, itv, lim) {
  for (let a = 0; a < 4; a++) {
    try { return await getKline(sym, itv, lim); } catch (e) { await wait(700 * (a + 1)); }
  }
  throw new Error('kline failed');
}
async function getKlinesFor(top) {
  const now = Date.now();
  const need = top.filter(t => {
    const c = klineCache[t.symbol + '|' + t.itv];
    return true;   // refresh is once a minute, so always re-download the candles
  });
  let idx = 0;
  const worker = async () => {
    while (idx < need.length) {
      const t = need[idx++];
      try { const ks = await getKlineRetry(t.symbol, t.itv, t.lim); if (ks.length) klineCache[t.symbol + '|' + t.itv] = { ks, at: Date.now() }; } catch (e) { /* keep the previous candles */ }
    }
  };
  await Promise.all([worker(), worker(), worker()]);   // at most 3 requests at a time
  return top.map(t => {
    const c = klineCache[t.symbol + '|' + t.itv];
    if (!c) return [];
    const last = c.ks[c.ks.length - 1];

function geo(cv, ks, plain) {

function drawCCI(g, G, all) {

  line(g, 0, yc(100), G.plotW, yc(100)); line(g, 0, yc(-100), G.plotW, yc(-100)); g.restore();
  g.font = '11px sans-serif'; g.fillStyle = '#848e9c'; g.fillText('100', G.plotW + 4, yc(100) + 4); g.fillText('-100', G.plotW + 4, yc(-100) + 4);

// ---------- hit test ----------
function segDist(px, py, x1, y1, x2, y2) {

}

  if (d.type === 'trend') return segDist(mx, my, x1, y1, x2, y2) < T;
  if (d.type === 'rect') return mx > Math.min(x1, x2) - T && mx < Math.max(x1, x2) + T && my > Math.min(y1, y2) - T && my < Math.max(y1, y2) + T;

  if (d.type === 'fibC') return channelLines(G, d).some(([, ax, ay, bx, by]) => segDist(mx, my, ax, ay, bx, by) < T);

    const d = arr[selected.i], G = card.G;
    for (const h of handles(d)) if (Math.hypot(x - h.x(G), y - h.y(G)) < 8) return { i: selected.i, part: h.part };

// ---------- mouse ----------
function attachMouse(card) {
  const { cv } = card;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('mousedown', e => {
    if (tool !== 'cursor' || !card.G || e.button !== 0) return;
    const [x, y] = pos(e), h = findHit(card, x, y);
    const prev = selected && selected.sym !== card.sym ? cardOf(selected.sym) : null;
    if (!h) { selected = null; drawCard(card); if (prev) drawCard(prev); return; }
    selected = { sym: card.sym, i: h.i };
    drag = { card, part: h.part, x0: x, y0: y, orig: JSON.parse(JSON.stringify(drawings[card.sym][h.i])), before: snap(), moved: false };
    if (prev) drawCard(prev);

      if (old) drawCard(old);

    }
    if (tool === 'fibC' && !pending.p2) { pending.p2 = P; drawCard(card); return; }
    if (tool === 'fibC') addDrawing(card, { type: 'fibC', p1: pending.p1, p2: pending.p2, p3: P });

          ${isNew ? '<span class="new">NEW</span>' : ''}
          <span class="chg ${pc >= 0 ? 'up' : 'dn'}">${pc >= 0 ? '+' : ''}${pc.toFixed(2)}%</span></div>
        <div class="chart"><canvas></canvas><button class="del" title="삭제 (Delete 키)">${ERASER_SVG}</button></div>`;
      grid.insertBefore(el, calcEl);
      const card = { sym: t.key, coin: t.symbol, plain: !!t.plain, ema: !!t.ema, cv: el.querySelector('canvas'), del: el.querySelector('.del'), ks: klines[i] };
      el.querySelector('.sym').onclick = () => openBybit(t.symbol);
      const star = el.querySelector('.star');
      star.onclick = () => toggleFav(t.symbol, star);
      card.del.addEventListener('mousedown', e => e.stopPropagation());
      card.del.onclick = e => { e.stopPropagation(); deleteSelected(); };
      cards.push(card); attachMouse(card); drawCard(card);
    });

}

document.querySelectorAll('[data-ex]').forEach(x => x.classList.toggle('on', x.dataset.ex === ex));
function scheduleMinute() {
  const ms = 60000 - (Date.now() % 60000) + 300;   // just after hh:mm:00
  setTimeout(() => { load(); scheduleMinute(); }, ms);
}
// ---------- slot 12: fixed stop-loss calculator (does not change with ranking) ----------
const CALC_KEY = 'calcV1';
const CALC_DEF = { sl: 20000, pct: 0.5, lev: 10, fx: 1336 };
function ensureCalc() {
  let el = document.getElementById('calcCard');
  if (el) return el;
  const v = Object.assign({}, CALC_DEF, JSON.parse(localStorage.getItem(CALC_KEY) || '{}'));
  el = document.createElement('div'); el.id = 'calcCard'; el.className = 'card calc';
  el.innerHTML = '<div class="c1"><div class="ins">'
    + '<label><span class="lf">손절금액 (원)</span><span class="ls">손절금액</span><input id="cSl" inputmode="numeric" value="' + v.sl.toLocaleString('ko-KR') + '"></label>'
    + '<label><span class="lf">손절폭 (%)</span><span class="ls">손절폭%</span><input id="cPct" inputmode="decimal" value="' + v.pct + '"></label>'
    + '<label><span class="lf">레버리지 (배)</span><span class="ls">레버리지</span><input id="cLev" inputmode="decimal" value="' + v.lev + '"></label>'
    + '<label><span class="lf">환율 (원/USDT)</span><span class="ls">환율</span><input id="cFx" inputmode="decimal" value="' + v.fx + '"></label>'
    + '</div><div class="res"><div class="l">바이낸스 입력값 USDT</div><div class="v" id="cOut">-</div></div></div>';
  $('grid').appendChild(el);
  const num = id => parseFloat(String($(id).value).replace(/,/g, ''));
  const calc = () => {
    const sl = num('cSl'), pct = num('cPct'), lev = num('cLev'), fx = num('cFx');
    const out = (sl > 0 && pct > 0 && fx > 0) ? sl / (pct / 100) / fx : 0;
    $('cOut').textContent = out ? out.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-';
    localStorage.setItem(CALC_KEY, JSON.stringify({ sl: sl || 0, pct: pct || 0, lev: lev || 0, fx: fx || 0 }));
  };
  ['cSl','cPct','cLev','cFx'].forEach(id => $(id).addEventListener('input', calc));
  $('cSl').addEventListener('blur', () => { const n = num('cSl'); if (n > 0) $('cSl').value = n.toLocaleString('ko-KR'); });
  el.addEventListener('keydown', e => e.stopPropagation());   // typing here never triggers chart shortcuts
  calc();
  return el;
}
fitGrid(); ensureCalc(); load(); scheduleMinute();
</script>
